[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snipshot-backend"
version = "1.0.0"
description = "SnipShot: Screen-Grounded Pedagogical Reel Generator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SnipShot Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "faster-whisper>=1.0.0",
    "stable-ts>=2.16.0",
    "rapidocr-onnxruntime>=1.3.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.2.0",
    "numpy>=1.26.0",
    "pygments>=2.17.0",
    "tree-sitter>=0.21.0",
    "jellyfish>=1.0.0",
    "rapidfuzz>=3.6.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "aiofiles>=23.2.1",
    "qrcode>=7.4.2"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
